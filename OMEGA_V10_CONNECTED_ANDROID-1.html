function renderLab(){let ar=BASE.predictions;const w=BASE.historical.filter(x=>x.won).length;let p=BASE.locked[0],ev=Number.isFinite(p?.prob)?p.prob:0;return `${toolbar('Model lab','Inspect assumptions, probability quality, and the real limits of these results.','<span class="pill neutral">V10 statistical core</span>')}
<div class="two-column"><section class="panel"><div class="panel-header"><h2>Research performance</h2><span class="pill neutral">Retrospective</span></div><div class="number accent">${pct(w/BASE.historical.length)}</div><div class="caption">60 correct / 68 historical picks · no real-money yield measured</div><div class="progress"><span style="width:${100*w/BASE.historical.length}%"></span></div><div class="detailrow"><span>Match forecasts</span><b>${ar.length}</b></div><div class="detailrow"><span>Research selections</span><b>${BASE.historical.length}</b></div><div class="detailrow"><span>Historical calibrated picks</span><b>0</b></div><div class="detailrow"><span>Historical odds input</span><b class="amber">Not connected</b></div><div class="risk lower">The displayed probabilities are research estimates. A high percentage or correct outcome does not guarantee positive returns.</div></section>
<section class="panel"><div class="panel-header"><h2>Fair-odds sandbox</h2>${svg('lab')}</div><p class="help">Explore the break-even odds from a hypothetical probability, then compare it with odds you type. This is not a verified betting signal.</p><div class="formgrid"><div class="field"><label for="lab-prob">Estimated probability (%)</label><input id="lab-prob" type="number" min="1" max="99" step=".1" class="input" value="80"/></div><div class="field"><label for="lab-odds">Illustrative decimal odds</label><input id="lab-odds" type="number" min="1.01" max="100" step=".01" class="input" value="1.20"/></div></div><div id="lab-result" class="callout">Enter probability and odds to compare.</div><p class="caption lower">Positive mathematical EV is meaningful only if the underlying probability is properly calibrated and the quoted price is genuinely available.</p></section></div>
<div class="sectionbar"><h2 class="section-title">What's behind the estimates?</h2></div><div class="two-column"><div class="panel"><div class="detailrow"><span>Goals & team form</span><b>Time-decayed Dixon–Coles</b></div><div class="detailrow"><span>Multiple market probabilities</span><b>One scoreline matrix</b></div><div class="detailrow"><span>xG / npXG observations</span><b class="amber">Not in demo data</b></div><div class="detailrow"><span>Verified lineups</span><b class="amber">Not connected</b></div><div class="detailrow"><span>Bookmaker price feeds</span><b class="amber">Not connected</b></div></div><div class="panel"><div class="panel-header"><h2>Import & export</h2>${svg('download')}</div><p class="help">Use the original Python research engine with verified data, then import its predictions into this app. Local entries stay on this device unless you export them.</p><div class="hero-actions"><button class="btn" data-action="import">Import predictions</button><button class="btn" data-action="export">Export my records</button><button class="btn" data-action="notify">Test notifications</button></div><p class="caption lower">Supported: V10 analysis.csv, research_top5.csv and the app's exported JSON format.</p></div></div>`}
function render(){renderMenu();$('#app').innerHTML=state.page==='live'?window.OMEGA_LIVE.render():state.page==='overview'?renderOverview():state.page==='picks'?renderPicks():state.page==='archive'?renderArchive():renderLab();if(state.page==='lab')calcLab()}
let toastTimer;function toast(m){let t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3600)}
function showModal(html){let m=$('#modal-layer');m.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Match details">${html}</div>`;m.hidden=false}
function hideModal(){$('#modal-layer').hidden=true;$('#modal-layer').innerHTML=''}
function detail(id){let r=activePicks().find(x=>x.id===id)||BASE.scanned.find(x=>x.id===id);if(!r)return;let st=mstatus(r),ratio=r.qualified===false?'<span class="pill warning">Below selection threshold</span>':'<span class="pill neutral">Research-only</span>';showModal(`<div class="modal-head"><div class="eyebrow">Match analysis</div><button class="xbtn" data-action="close" aria-label="Close">✕</button></div><h2 class="page-title" style="font-size:25px">${esc(r.home)} vs ${esc(r.away)}</h2><div class="caption">${esc(r.league)} · ${day(r.date)}</div><div class="divider"></div><div class="detailrow"><span>Selected market</span><b>${esc(r.market)}</b></div><div class="detailrow"><span>Uncalibrated model probability</span><b class="accent">${pct(r.prob)}</b></div><div class="detailrow"><span>Fair odds (mathematical)</span><b>${r.prob?money(1/r.prob):'—'}</b></div><div class="detailrow"><span>Verified bookmaker odds</span><b class="amber">Unavailable</b></div><div class="detailrow"><span>Paper-test status</span><b>${st.toUpperCase()}</b></div>${r.status==='final'?`<div class="detailrow"><span>Full-time score</span><b>${r.hg}–${r.ag}</b></div>`:''}<p class="help lower">${ratio} The model probability is an unverified estimate. No real-money recommendation has been issued.</p>${r.status==='pending'&&r.qualified!==false?`<button class="btn primary lower" data-record="${esc(r.id)}">Record verified final score</button>`:''}`)}
function record(id){let r=activePicks().find(x=>x.id===id);if(!r)return;showModal(`<div class="modal-head"><div class="eyebrow">Paper-trial settlement</div><button class="xbtn" data-action="close" aria-label="Close">✕</button></div><h2 style="font:700 22px 'Space Grotesk',sans-serif">${esc(r.home)} vs ${esc(r.away)}</h2><p class="help">Enter a final score you have verified independently. This does not fetch official match results.</p><div class="formgrid"><div class="field"><label for="score-home">${esc(r.home)} goals</label><input id="score-home" class="input" type="number" min="0" max="30" step="1" value="${r.hg??0}"/></div><div class="field"><label for="score-away">${esc(r.away)} goals</label><input id="score-away" class="input" type="number" min="0" max="30" step="1" value="${r.ag??0}"/></div></div><div class="risk">Saved results are manually entered and not independently verified by the app. Original locked picks cannot be changed.</div><button class="btn primary lower" data-save-result="${esc(r.id)}">Save full-time result</button>`)}
function calcLab(){const out=$('#lab-result');if(!out)return;const p=+$('#lab-prob').value/100,odds=+$('#lab-odds').value;if(!(p>0&&p<1&&odds>1)){out.textContent='Please enter a probability from 1–99% and decimal odds greater than 1.';return}const edge=p*odds-1;out.innerHTML=`Fair odds <b>${money(1/p)}</b> · Illustrative EV <b class="${edge>=0?'accent':'red'}">${edge>=0?'+':''}${(edge*100).toFixed(1)}%</b><div class="caption lower">Not a verified edge. Assumes the estimated probability is accurate.</div>`}
function downloadFile(content,name,mime){const blob=new Blob([content],{type:mime});let a=document.createElement('a');let url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function csvField(v){let s=String(v??'');return /[,\r\n"]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportRecords(){const obj={exported_at:new Date().toISOString(),app:'OMEGA V10 Android research app',frozen_picks:BASE.locked.map(cleanMatch),historical_research:BASE.historical,earlier_forward_trial:BASE.priorTrial,manual_result_entries:state.paperResults,imported_analysis:state.imported};downloadFile(JSON.stringify(obj,null,2),'OMEGA_V10_RESEARCH_EXPORT.json','application/json');toast('Research records exported')}
function parseCsv(s){const out=[];let row=[],cell='',quote=false;for(let i=0;i<s.length;i++){const ch=s[i];if(quote){if(ch==='"'&&s[i+1]==='"'){cell+='"';i++}else if(ch==='"'){quote=false}else cell+=ch}else if(ch==='"'){quote=true}else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell.replace(/\r$/,''));if(row.some(x=>x))out.push(row);row=[];cell=''}else cell+=ch}row.push(cell.replace(/\r$/,''));if(row.some(x=>x))out.push(row);const headers=out.shift()?.map(x=>x.trim())||[];return out.map(r=>Object.fromEntries(headers.map((k,i)=>[k,r[i]??''])))}
function importRecords(text,name){let data;if(name.toLowerCase().endsWith('.json')){let raw=JSON.parse(text);if(raw?.app==='OMEGA V10 Android research app'&&raw.manual_result_entries){state.paperResults=raw.manual_result_entries||{};state.imported=Array.isArray(raw.imported_analysis)?raw.imported_analysis:[];persist();toast('Your research backup was restored');render();return}if(Array.isArray(raw))data=raw;else if(Array.isArray(raw.imported_analysis)&&raw.imported_analysis.length)data=raw.imported_analysis;else if(Array.isArray(raw.frozen_picks))data=raw.frozen_picks;else throw Error('No prediction array found in JSON');}else data=parseCsv(text);if(data.length>1500)throw Error('Limit: 1,500 imported rows');let valid=data.map((r,i)=>{let prob=Number(r.dc_p??r.prob??r.probability??r.estimated_probability),home=String(r.home||'').trim().slice(0,90),away=String(r.away||'').trim().slice(0,90),market=String(r.dc_market??r.market??'').toUpperCase(),kickoff=String(r.kickoff??r.kickoff_SAST??'').trim(),d=String(r.date??r.match_date??kickoff.substring(0,10));if(!home||!away||!['1X','X2','1','2','X','12','O1.5','U3.5','BTTS'].includes(market)||!(prob>0&&prob<=1)||!/\d{4}-\d\d-\d\d/.test(d))return null;return{id:'imp'+i+'_'+d+'_'+home+'_'+away,home,away,date:d,kickoff,market,prob,league:String(r.league||'Imported research').slice(0,90),status:'pending',source:'User-imported · unverified provenance',calibrated:false}}).filter(Boolean);if(!valid.length)throw Error('No valid V10 prediction rows. Use analysis.csv or app export format.');state.imported=valid;state.importSource=name;persist();toast(`Imported ${valid.length} research predictions`);state.page='picks';state.view='selected';render()}
function action(ev){let el=ev.target.closest('[data-page],[data-view],[data-detail],[data-action],[data-record],[data-save-result]');if(!el)return;const {page,view,detail:detailId,action:act,record:rec,saveResult}=el.dataset;if(page){state.page=page;render();scrollTo({top:0,behavior:'smooth'})}else if(view){state.view=view;render()}else if(detailId){detail(detailId)}else if(rec){record(rec)}else if(saveResult){let h=+$('#score-home').value,a=+$('#score-away').value;if(!Number.isInteger(h)||!Number.isInteger(a)||h<0||a<0||h>30||a>30){toast('Enter valid final scores (0–30)');return}state.paperResults[saveResult]={hg:h,ag:a,enteredAt:new Date().toISOString(),verification:'manual user entry'};persist();hideModal();render();toast('Full-time result saved locally')}else if(act==='close'){hideModal()}else if(act==='import'){$('#file-input').click()}else if(act==='export'){exportRecords()}else if(act==='notify'){enableNotice()}}
async function enableNotice(){if(!('Notification' in window)){toast('Notifications are unavailable in this browser');return}let p=await Notification.requestPermission();if(p==='granted'){new Notification('PRO-PITCH OMEGA',{body:'Notifications work while your browser/app is active. Automatic score alerts require a hosted push service.'})}else toast('Notification permission was not granted')}
let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;const b=$('#install-app');if(b)b.hidden=false});$('#install-app').addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('#install-app').hidden=true});
document.addEventListener('click',action);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal-layer').hidden)hideModal();if(['Enter',' '].includes(e.key)&&e.target.matches('[data-detail]')){e.preventDefault();detail(e.target.dataset.detail)}});
document.addEventListener('input',e=>{if(e.target.id==='archive-search'){state.archiveSearch=e.target.value;let box=$('#archive-results');if(box)box.innerHTML=archiveRows()}if(e.target.id==='lab-prob'||e.target.id==='lab-odds')calcLab()});document.addEventListener('change',e=>{if(e.target.id==='archive-league'){state.archiveLeague=e.target.value;let box=$('#archive-results');if(box)box.innerHTML=archiveRows()}});$('#modal-layer').addEventListener('click',e=>{if(e.target===$('#modal-layer'))hideModal()});$('#file-input').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>1500000)throw Error('File too large');importRecords(await f.text(),f.name)}catch(err){toast('Import failed: '+err.message)}e.target.value=''});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
window.OMEGA_LIVE.init(render);
})();
</script>
</body></html>
